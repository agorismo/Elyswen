[package]
name = "elyswen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
eframe = "0.37.0"
hex = "0.4.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
open = "5.4.5"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
zip = "9.5.1"
